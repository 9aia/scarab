[package]
name = "scarab-config"
description = "Config port — ConfigSource<T>/ConfigFormat generic over the config model, plus the shared file-discovery spec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Deliberately not `workspace = true`: the workspace dep carries
# `preserve_order`, which would leak into every consumer's serde_json
# (pavo's surface tests key on sorted request JSON). Config merge is
# order-agnostic — it must not impose doc-order semantics downstream.
serde_json = "1.0"

[dev-dependencies]
serde.workspace = true
