# scarab release config — org release conventions inlined (ADR-0004/0005)
# so repos don't depend on an installed profile pack. Tag-only:
# crates.io is tamias-only and GitHub Releases are unused — after
# tagging, ship the repo's tamias pack manually
# (`tamias publish libraries/rust-repo`).
#
# Units default to cargo workspace members; versions are
# workspace-inherited, so releasing units share one bump.

[release]
styleguide = "keep-a-changelog"
changelog_path = "CHANGELOG.md"
diff_exclude = ["docs/**", "project/**", "*.md", ".github/**"]
tag_format = "{unit}-v{version}"

[release.unit_overrides.scarab-xtask]
skip = true

# Pack-ref sync (T-039): the example pack manifest version is
# rewritten to the new version inside the release commit, so the
# tagged tree is self-consistent — replaces the release.sh
# plan+sed pre-step. The README's `version:` example is unrelated
# content and stays untouched.
[release.sync_refs]
rules = [
  { files = ["libraries/rust-repo/tamias.yaml"], find = "(?m)^version: \"{old}\"", replace = "version: \"{new}\"" },
]

[publish.crates]
enabled = false   # ADR-0004: crates.io publishing is tamias-only

[publish.ghreleases]
enabled = false   # org releases are tag-only; capability stays for opt-in
